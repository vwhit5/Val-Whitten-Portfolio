    :root {
      --ink: #161618;
      --muted: rgba(22, 22, 24, 0.66);
      --line: #e4e4e7;
      --orange: #f25533;
      --soft: #fef1ef;
      --sand: #f7f7f8;
      --green: #187f65;
      --green-bg: #d8f8f0;
      --blue: #0229ff;
      --blue-bg: #dbe9fe;
      --amber: #854d0e;
      --amber-bg: #fef9c3;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: #fff; color: var(--ink); }
    body {
      font-family: ui-sans-serif, system-ui, "Segoe UI", sans-serif;
      font-size: 18px;
      line-height: 1.45;
    }
    h1, h2, .serif { font-family: "Iowan Old Style", Palatino, "Palatino Linotype", "Liberation Serif", Georgia, serif; font-weight: 400; letter-spacing: -0.03em; }
    h1 { font-size: clamp(2.15rem, 6vw, 3.6rem); line-height: 1.05; margin: 0 0 12px; }
    h2 { font-size: clamp(1.7rem, 3vw, 2.05rem); line-height: 1.15; margin: 0 0 10px; color: var(--ink); }
    p { margin: 0 0 14px; }
    button, input { font: inherit; color: inherit; }
    button { cursor: pointer; }
    .hand { font-family: Kalam, "Segoe Print", cursive; }
    .wrap { max-width: 1040px; margin: 0 auto; padding: 22px 20px 150px; }
    .label { margin: 0 0 18px; color: var(--muted); font-size: 0.92rem; }
    .side-banner {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 14px;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 5;
      width: 100%;
      padding: 10px 20px;
      font-size: 0.92rem;
    }
    .side-banner[hidden] { display: none; }
    .side-banner.candidate { background: var(--orange); color: #fff; }
    .side-banner.team { background: var(--ink); color: #fff; }
    .side-banner.between { background: var(--soft); color: var(--ink); border-bottom: 1px solid #f6d2cb; width: 100%; }
    .badge {
      display: inline-block;
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.04em;
    }
    .badge-inline {
      display: inline-block;
      margin: 0 0 10px;
      padding: 4px 8px;
      border-radius: 999px;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.04em;
    }
    .badge-inline.candidate { background: var(--orange); color: #fff; }
    .badge-inline.team { background: var(--ink); color: #fff; }
    .byline { display: flex; align-items: center; gap: 2px; margin: 0 0 16px; max-width: 100%; }
    .arrow { width: 70px; height: 28px; flex: none; }
    .byline .name { margin: 0; font-size: 1.2rem; line-height: 1; }
    .problems { display: grid; gap: 12px; margin: 6px 0 18px; }
    .problem { border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; margin: 0; min-width: 0; }
    .problem strong { display: block; margin-bottom: 6px; }
    .problem .num { color: var(--orange); margin-right: 6px; }
    .problem p { margin: 0; }
    @media (min-width: 860px) { .problems { grid-template-columns: 1fr 1fr 1fr; } }
    .lede { color: var(--muted); font-size: 1.05rem; }
    .for-team { font-size: 1rem; }
    .row { display: flex; flex-wrap: wrap; gap: 10px; }
    .cta, .ghost, .choice {
      border-radius: 999px;
      min-height: 48px;
      padding: 10px 18px;
      border: 1px solid var(--line);
      background: #fff;
    }
    .cta { background: var(--orange); color: #fff; border-color: var(--orange); font-weight: 600; }
    .cta.big { min-height: 52px; padding: 12px 22px; }
    .choice[aria-pressed="true"] { background: var(--orange); color: #fff; border-color: var(--orange); }
    .ghost { background: transparent; }
    .hub { display: grid; grid-template-columns: 190px minmax(0, 1fr); gap: 36px; align-items: start; margin-top: 8px; }
    .hub-nav { min-width: 0; }
    .nav-group { margin: 14px 0 6px; color: var(--muted); font-size: 0.86rem; }
    .hub-nav span { display: block; padding: 6px 0 6px 12px; font-size: 0.95rem; }
    .nav-active { color: var(--orange); font-weight: 650; box-shadow: inset 2px 0 0 var(--orange); }
    .proposed { margin: 0 0 8px; color: var(--orange); font-size: 0.86rem; font-weight: 650; }
    .panel {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 16px;
      margin-top: 8px;
    }
    label { display: block; font-size: 0.92rem; font-weight: 650; margin: 12px 0 6px; }
    input[type="text"], input[type="number"], input:not([type="file"]), textarea {
      width: 100%;
      max-width: 100%;
      border: 1px solid #cacace;
      border-radius: 8px;
      padding: 12px;
      background: #fff;
    }
    textarea { min-height: 160px; resize: vertical; }
    .locked { background: var(--sand); border-radius: 8px; padding: 10px 12px; }
    .locked p { margin: 0; }
    .tiny { min-height: 36px; padding: 6px 10px; font-size: 0.85rem; }
    .row-actions { display: flex; flex-wrap: wrap; gap: 6px; grid-column: 1 / -1; }
    input[type="file"] { max-width: 100%; width: 100%; font-size: 0.92rem; }
    input[type="file"]::file-selector-button {
      border: 1px solid var(--line);
      background: #fff;
      border-radius: 999px;
      padding: 8px 12px;
      margin-right: 8px;
    }
    .hint { color: var(--muted); font-size: 0.92rem; }
    .receipt-photo {
      display: block;
      width: 150px;
      max-width: 100%;
      height: auto;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fffdf8;
    }
    .thumb {
      width: 44px;
      height: 58px;
      object-fit: cover;
      border-radius: 4px;
      border: 1px solid var(--line);
      display: block;
      background: #fffdf8;
    }
    pre.note {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      font-family: inherit;
      margin: 12px 0 0;
      line-height: 1.5;
    }
    .tool { background: var(--sand); border-radius: 12px; padding: 8px; margin-top: 8px; }
    .tool-top {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      padding: 10px 12px 4px;
      font-size: 0.92rem;
    }
    .tool-body { background: #fff; border-radius: 10px; padding: 18px; }
    .toggle {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 0;
      border-bottom: 1px solid var(--line);
    }
    .toggle p { margin: 0; font-weight: 650; }
    .toggle small { display: block; font-weight: 400; color: var(--muted); }
    .switch {
      width: 48px;
      height: 28px;
      border: 0;
      border-radius: 99px;
      background: #cacace;
      position: relative;
      flex: none;
      padding: 0;
    }
    .switch[aria-pressed="true"] { background: var(--orange); }
    .switch .knob {
      position: absolute;
      top: 3px;
      left: 3px;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: #fff;
    }
    .switch[aria-pressed="true"] .knob { transform: translateX(20px); }
    .rows { display: grid; gap: 8px; margin-top: 12px; }
    .rowcard {
      display: grid;
      grid-template-columns: 52px 0.7fr 0.8fr 1.4fr 0.8fr;
      gap: 8px;
      align-items: center;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 10px 12px;
      min-width: 0;
    }
    .rowcard b { display: block; font-size: 0.75rem; font-weight: 650; color: var(--muted); }
    .rowcard span { overflow-wrap: anywhere; min-width: 0; }
    .mail {
      display: grid;
      grid-template-columns: minmax(0, 250px) minmax(0, 1fr);
      border: 1px solid var(--line);
      border-radius: 12px;
      overflow: hidden;
      margin-top: 8px;
      background: #fff;
    }
    .mail-side { background: var(--sand); padding: 12px; min-width: 0; }
    .mail-folder { margin: 0 0 8px; font-size: 0.82rem; font-weight: 650; color: var(--muted); }
    .mail-row {
      display: block;
      width: 100%;
      text-align: left;
      background: #fff;
      border-left: 3px solid var(--orange);
      padding: 10px 12px;
      min-width: 0;
    }
    .mail-row strong, .mail-row span, .mail-row em { display: block; overflow-wrap: anywhere; }
    .mail-row span, .mail-row em { font-style: normal; color: var(--muted); font-size: 0.86rem; font-weight: 400; }
    .mail-open { padding: 16px 18px 8px; min-width: 0; }
    .mail-open h2 { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 1.25rem; letter-spacing: -0.02em; font-weight: 650; }
    .mail-meta { color: var(--muted); font-size: 0.92rem; overflow-wrap: anywhere; }
    .mail-body p { margin: 0 0 12px; }
    .status { display: inline-block; border-radius: 999px; padding: 3px 8px; font-size: 0.82rem; font-weight: 650; }
    .status.pending { background: var(--amber-bg); color: var(--amber); }
    .status.approved { background: var(--blue-bg); color: var(--blue); }
    .status.paid { background: var(--green-bg); color: var(--green); }
    .slack { background: #1a1d21; color: #f8f5f0; border-radius: 12px; padding: 14px; margin-top: 8px; }
    .slack header { color: #fff; font-weight: 700; margin-bottom: 10px; }
    .slack header small { display: block; color: #b9bbbe; font-weight: 400; }
    .msg { background: #222529; border-radius: 8px; padding: 12px; margin-top: 8px; }
    .msg strong { color: #f67654; }
    .msg.off { color: #b9bbbe; }
    .block { margin-top: 28px; }
    .bar {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(255, 255, 255, 0.96);
      border-top: 1px solid var(--line);
      padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
    }
    .bar[hidden] { display: none; }
    .bar-inner { max-width: 1040px; margin: 0 auto; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
    .progress { flex: 1 1 180px; min-width: 0; }
    .stepnum { font-size: 0.82rem; color: var(--muted); margin-bottom: 4px; }
    .parts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .part { min-width: 0; font-size: 0.82rem; }
    .part em { display: block; font-style: normal; color: var(--muted); font-size: 0.72rem; }
    .part strong { font-weight: 650; }
    .part.is-current strong { color: var(--orange); }
    #part2.is-current strong { color: var(--ink); }
    .track { height: 4px; background: var(--line); border-radius: 99px; margin-top: 4px; overflow: hidden; }
    .fill { height: 100%; width: 0; background: var(--orange); }
    #part2 .fill { background: var(--ink); }
    :focus-visible { outline: 2px solid var(--orange); outline-offset: 2px; }
    @media (max-width: 720px) {
      .hub { grid-template-columns: 1fr; gap: 12px; }
      .hub-nav { display: flex; flex-wrap: wrap; gap: 6px 12px; }
      .nav-group { width: 100%; margin: 0; }
      .hub-nav span { display: inline; padding: 0; }
      .nav-active { box-shadow: none; }
      .rowcard { grid-template-columns: 52px minmax(0, 1fr); }
      .row-actions { grid-column: 1 / -1; }
      .mail { grid-template-columns: 1fr; }
      .wrap { padding: 18px 16px 160px; }
    }
  </style>
</head>
<body>
  <div class="side-banner" id="banner" hidden></div>
  <div class="wrap">
    <div id="stage" aria-live="polite"></div>
  </div>
  <div class="bar" id="bar" hidden>
    <div class="bar-inner">
      <button class="ghost" type="button" id="back">Back</button>
      <button class="ghost" type="button" id="skip-bar">Skip tour</button>
      <div class="progress">
        <div class="stepnum" id="stepnum"></div>
        <div class="parts" aria-hidden="true">
          <div class="part" id="part1"><em>Part 1</em><strong>Candidate</strong><div class="track"><div class="fill" id="fill1"></div></div></div>
          <div class="part" id="part2"><em>Part 2</em><strong>Team</strong><div class="track"><div class="fill" id="fill2"></div></div></div>
        </div>
      </div>
      <button class="cta" type="button" id="next">Next</button>
    </div>
  </div>
  <script>
    const SAMPLE = {
      name: "Jordan Example",
      first: "Jordan",
      date: "2026-11-02",
      paypal: "demo.candidate@example.com",
      venmo: "@demo-candidate",
      inbox: "jordan.example@example.com",
      recruiter: "Sam",
      recruiterFrom: "Sam from incident.io Talent",
      recruiterEmail: "talent@example.com",
      subject: "Thank you for spending the day with us",
      onsite: "Nov 2, 2026 · San Francisco",
      interviewers: ["@Mina", "@Luis"]
    };

    const FINALISTS = [
      { id: "jordan", first: "Jordan", name: "Jordan Example", email: "jordan.example@example.com", kind: "passed" },
      { id: "riley", first: "Riley", name: "Riley Moss", email: "riley.moss@example.com", kind: "passed" },
      { id: "casey", first: "Casey", name: "Casey Nguyen", email: "casey.nguyen@example.com", kind: "other" },
      { id: "alex", first: "Alex", name: "Alex Preview", email: "alex.preview@example.com", kind: "other" }
    ];

    const STEPS = [
      { id: "welcome", part: 0, side: "none" },
      { id: "receipt", part: 1, side: "candidate" },
      { id: "late", part: 1, side: "candidate" },
      { id: "transition", part: 0, side: "switch" },
      { id: "admin", part: 2, side: "team" },
      { id: "queue", part: 2, side: "team" },
      { id: "slack", part: 2, side: "team" },
      { id: "compose", part: 2, side: "team" },
      { id: "inbox", part: 0, side: "candidate" },
      { id: "close", part: 0, side: "none" }
    ];

    const SUBMISSIONS = [
      { name: "Jordan Example", handle: "demo.candidate@example.com", method: "PayPal", amount: "18.50", status: "pending", date: "2026-11-02" },
      { name: "Sam Sample", handle: "@demo-candidate", method: "Venmo", amount: "22.00", status: "approved", date: "2026-10-28" },
      { name: "Alex Preview", handle: "demo.alex@example.com", method: "PayPal", amount: "15.00", status: "paid", date: "2026-10-21" }
    ];

    const state = {
      mode: "tour",
      step: 0,
      amount: "18.50",
      method: "paypal",
      handles: { paypal: SAMPLE.paypal, venmo: SAMPLE.venmo },
      eta: 10,
      why: "The train is delayed",
      reimbursement: true,
      lateNotes: true,
      gift: true,
      provider: "tremendous",
      giftAmount: "25",
      reminder: true,
      finalist: "jordan",
      noteKind: "passed",
      sentSubject: "",
      noteOverride: "",
      sentNote: "",
      submitted: false,
      thanksSent: false,
      photoUrl: ""
    };

    function peopleForKind() {
      const kind = state.noteKind === "other" ? "other" : "passed";
      return FINALISTS.filter((person) => person.kind === kind);
    }

    function currentFinalist() {
      const people = peopleForKind();
      return people.find((person) => person.id === state.finalist) || people[0];
    }

    function subjectLine() {
      return state.noteKind === "other" ? "Glad we got to meet you" : SAMPLE.subject;
    }

    const stage = document.getElementById("stage");
    const bar = document.getElementById("bar");
    const banner = document.getElementById("banner");
    let painted = { mode: "", step: -1 };

    function esc(value) {
      return String(value).replace(/[&<>"']/g, (ch) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      }[ch]));
    }

    function money(value) {
      const n = Number(value);
      return (Number.isFinite(n) ? n : 0).toFixed(2);
    }

    function providerLabel() {
      if (state.provider === "perfectgift") return "PerfectGift.com";
      if (state.provider === "candle") return "Bath & Body Works";
      return "Tremendous";
    }

    function providerButtons() {
      const options = [
        ["tremendous", "Tremendous"],
        ["perfectgift", "PerfectGift.com"],
        ["candle", "Bath & Body Works candle card"]
      ];
      return '<div class="row">' + options.map((option) => '<button class="choice" type="button" data-provider="' + option[0] + '" aria-pressed="' + (state.provider === option[0]) + '">' + option[1] + '</button>').join("") + '</div>';
    }

    function giftLine() {
      const amount = money(state.giftAmount).replace(/\.00$/, "");
      if (state.provider === "candle") {
        return "We'd love to send you a $" + amount + " Bath & Body Works gift card. Pick a candle. Fitting for a team that spends its days putting out fires.";
      }
      const closer = state.noteKind === "other" ? " It is a thank-you for your time." : " It is simply a thank-you.";
      return "We would like to send you a $" + amount + " gift card through " + providerLabel() + "." + closer;
    }

    function handle() {
      return state.handles[state.method] || "";
    }

    function methodLabel() {
      return state.method === "venmo" ? "Venmo" : "PayPal";
    }

    function sampleReceiptSrc(amount) {
      const total = money(amount);
      const svg = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 230"><rect width="180" height="230" fill="#fffdf8"/><rect x="1" y="1" width="178" height="228" fill="none" stroke="#e4e4e7"/><text x="90" y="36" text-anchor="middle" font-family="ui-sans-serif,sans-serif" font-size="13" fill="#161618">PARKING</text><text x="90" y="56" text-anchor="middle" font-family="ui-sans-serif,sans-serif" font-size="11" fill="#5f5f68">Synthetic sample</text><text x="90" y="78" text-anchor="middle" font-family="ui-sans-serif,sans-serif" font-size="11" fill="#5f5f68">Not a real charge</text><text x="20" y="120" font-family="ui-sans-serif,sans-serif" font-size="12" fill="#161618">Date</text><text x="160" y="120" text-anchor="end" font-family="ui-sans-serif,sans-serif" font-size="12" fill="#161618">' + SAMPLE.date + '</text><text x="20" y="148" font-family="ui-sans-serif,sans-serif" font-size="12" fill="#161618">Garage</text><text x="160" y="148" text-anchor="end" font-family="ui-sans-serif,sans-serif" font-size="12" fill="#161618">2nd Street</text><text x="20" y="186" font-family="ui-sans-serif,sans-serif" font-size="16" fill="#161618">Total</text><text x="160" y="186" text-anchor="end" font-family="ui-sans-serif,sans-serif" font-size="16" fill="#f25533">$' + total + '</text></svg>';
      return "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg);
    }

    function thanksParagraphs() {
      const person = currentFinalist();
      const lines = [person.first + ","];
      if (state.noteKind === "other") {
        lines.push("We are genuinely happy for you. Choosing another company is a big step and we are glad you found a place that fits.");
        lines.push("We are glad we met you. That time together mattered to us.");
        lines.push("The door here stays open. If you ever want to talk again we would like that.");
      } else {
        lines.push("Thank you for spending the day with us. The team genuinely enjoyed meeting you.");
        lines.push("Your take-home was clear and specific. That stayed with us after you left.");
        lines.push("It was a close call and we are sorry this role is not the right match.");
        lines.push("Please stay in touch if you would like to. When a role opens that fits what you want we would be glad to hear from you.");
      }
      if (state.gift) lines.push(giftLine());
      lines.push(SAMPLE.recruiter);
      return lines;
    }

    function noteText() {
      return state.sentNote || state.noteOverride || thanksParagraphs().join("\n\n");
    }

    function reminderText() {
      if (!state.reminder) return "Reminders are off. A candidate would not get a nudge.";
      return "Hi Jordan. If you have a parking receipt from the onsite you can upload it on your page. It only takes a minute.\n\nSam";
    }

    function lateText() {
      const lines = ["Running late for the onsite.", "Why: " + (state.why || "No reason added")];
      if (state.eta) lines.push("ETA: about " + state.eta + " minutes");
      return lines.join("\n");
    }

    function slackLateText() {
      if (!state.lateNotes) return "Late notes are turned off so this would not post.";
      return SAMPLE.name + " is running late for the onsite.\n" + (state.why || "No reason added") + "\nETA about " + state.eta + " minutes.\n" + SAMPLE.interviewers.join(" ");
    }

    function slackReceiptText() {
      if (!state.reimbursement) return "Parking reimbursement is turned off so a receipt would not post.";
      return SAMPLE.name + " uploaded a parking receipt on the page.\nUSD " + money(state.amount) + " via " + methodLabel() + ".\nHandle: " + handle();
    }

    function livePreviewText() {
      const lines = [
        state.reimbursement ? "Parking reimbursement is on. A candidate uploads a receipt on the page." : "Parking reimbursement is off. The candidate page hides the receipt.",
        state.reminder ? "A reminder goes out if no receipt arrives the day after the onsite." : "The receipt reminder is off.",
        state.lateNotes ? "Late notes are on. A note pings " + SAMPLE.interviewers.join(" and ") + " in the thread." : "Late notes are off. Interviewers would not be pinged.",
        state.gift
          ? "Gift is on. The thank-you includes a $" + money(state.giftAmount).replace(/\.00$/, "") + (state.provider === "candle" ? " Bath & Body Works candle card." : " card through " + providerLabel() + ".")
          : "Gift is off. The thank-you note has no gift card."
      ];
      return lines.join("\n\n");
    }

    function arrow() {
      return '<svg class="arrow" viewBox="0 34 196 58" aria-hidden="true"><path d="M8 74 C 40 74, 34 50, 62 54 S 96 86, 124 62 S 162 40, 176 56" fill="none" stroke="#f25533" stroke-width="3.5" stroke-linecap="round"/><path d="M160 44 L188 56 L162 70" fill="none" stroke="#f25533" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></svg>';
    }

    function hubNav() {
      return '<nav class="hub-nav" aria-label="Proposed Candidate Hub section"><p class="nav-group">Hiring</p><span class="nav-active">Final interview in SF</span><span>How we hire</span><span>FAQs</span><p class="nav-group">Life at incident.io</p><span>SF office</span></nav>';
    }

    function candidateShell(title, lede, body) {
      return '<div class="hub">' + hubNav() + '<article><p class="proposed">Proposed addition to the Candidate Hub</p><h2>' + title + '</h2><p class="lede">' + lede + '</p>' + body + '</article></div>';
    }

    function teamShell(title, lede, body) {
      return '<div class="tool"><div class="tool-top"><strong>Talent tools</strong><span>Internal</span></div><div class="tool-body"><h2>' + title + '</h2><p class="lede">' + lede + '</p>' + body + '</div></div>';
    }

    function receiptBody() {
      if (!state.reimbursement) {
        return '<div class="panel"><p>Parking reimbursement is turned off in Talent tools. A candidate would not see this section.</p></div>';
      }
      const paypal = state.method === "paypal";
      const src = state.photoUrl || sampleReceiptSrc(state.amount);
      const note = state.submitted ? '<p id="submit-note">Submitted. The Talent team will reimburse you.</p>' : '<p id="submit-note" hidden>Submitted. The Talent team will reimburse you.</p>';
      return '<div class="panel"><div class="locked"><p>' + esc(SAMPLE.name) + '</p><p>Your onsite: ' + esc(SAMPLE.onsite) + '</p></div><label for="receipt-file">Receipt photo</label><img class="receipt-photo" id="receipt-photo" alt="Synthetic sample parking receipt" src="' + src + '"><p class="hint" id="file-name">A sample photo is already here. You can replace it. It stays in this browser.</p><input id="receipt-file" type="file" accept="image/*"><label for="amount">Amount in USD</label><input id="amount" inputmode="decimal" value="' + esc(state.amount) + '"><label>Pay with</label><div class="row"><button class="choice" type="button" data-method="paypal" aria-pressed="' + paypal + '">PayPal</button><button class="choice" type="button" data-method="venmo" aria-pressed="' + (!paypal) + '">Venmo</button></div><label for="handle">' + methodLabel() + ' handle</label><input id="handle" type="text" value="' + esc(handle()) + '"><p class="hint">A sample handle is filled in. Do not type a real account.</p><div class="row" style="margin-top:14px"><button class="cta" type="button" id="submit-receipt">Submit</button></div>' + note + '</div>';
    }

    function lateBody() {
      if (!state.lateNotes) {
        return '<div class="panel"><p>Late notes are turned off in Talent tools. A candidate would not see this section.</p></div>';
      }
      const etas = [5, 10, 15, 30].map((n) => '<button class="choice" type="button" data-eta="' + n + '" aria-pressed="' + (state.eta === n) + '">' + n + ' min</button>').join("");
      return '<div class="panel"><label for="why">Why</label><input id="why" type="text" value="' + esc(state.why) + '"><label>How late</label><div class="row">' + etas + '</div><pre class="note" id="late-preview"></pre></div>';
    }

    function thanksBody() {
      return thanksParagraphs().map((line) => '<p>' + esc(line) + '</p>').join("");
    }

    function composeBody() {
      const person = currentFinalist();
      const picks = peopleForKind().map((person) => '<button class="choice" type="button" data-finalist="' + person.id + '" aria-pressed="' + (state.finalist === person.id) + '">' + esc(person.name) + '</button>').join("");
      const kinds = '<div class="row"><button class="choice" type="button" data-kind="passed" aria-pressed="' + (state.noteKind !== "other") + '">Finalist not moving forward</button><button class="choice" type="button" data-kind="other" aria-pressed="' + (state.noteKind === "other") + '">Chose another company</button></div>';
      return '<div class="panel"><label>Note type</label>' + kinds + '<label>Finalist</label><div class="row">' + picks + '</div>' +
        switchRow("gift", state.gift, "Include the $25 gift", "Adds the gift card line to the note.") +
        '<label>Gift provider</label>' + providerButtons() +
        '<p><strong>To</strong> ' + esc(person.name) + ' &lt;' + esc(person.email) + '&gt;</p><p><strong>From</strong> ' + esc(SAMPLE.recruiterFrom) + ' &lt;' + esc(SAMPLE.recruiterEmail) + '&gt;</p><p><strong>Subject</strong> ' + esc(subjectLine()) + '</p><label for="note-text">Note</label><textarea id="note-text"></textarea><div class="row" style="margin-top:12px"><button class="cta" type="button" id="send-thanks">Send</button></div><p class="hint">Send opens their inbox on the next screen. Nothing leaves this page.</p></div>';
    }

    function inboxBody() {
      const person = state.sentTo || currentFinalist();
      const subject = state.sentSubject || subjectLine();
      const paragraphs = (state.sentNote || noteText()).split(/\n{2,}/).map((line) => line.trim()).filter(Boolean).map((line) => '<p>' + esc(line) + '</p>').join("");
      return '<div class="mail"><div class="mail-side"><p class="mail-folder">Inbox</p><div class="mail-row"><strong>' + esc(SAMPLE.recruiterFrom) + '</strong><span>&lt;' + esc(SAMPLE.recruiterEmail) + '&gt;</span><em>' + esc(subject) + '</em></div></div><article class="mail-open"><p class="mail-meta">From ' + esc(SAMPLE.recruiterFrom) + ' &lt;' + esc(SAMPLE.recruiterEmail) + '&gt;<br>To ' + esc(person.name) + ' &lt;' + esc(person.email) + '&gt;</p><h2>' + esc(subject) + '</h2><div class="mail-body" id="inbox-body">' + paragraphs + '</div></article></div>';
    }

    function switchRow(key, on, title, detail) {
      return '<div class="toggle"><div><p>' + title + '</p><small>' + detail + '</small></div><button class="switch" type="button" data-toggle="' + key + '" aria-pressed="' + on + '" aria-label="' + title + '"><span class="knob"></span></button></div>';
    }

    function adminBody() {
      return '<div class="panel">' +
        switchRow("reimbursement", state.reimbursement, "Enable parking reimbursement", "Shows the receipt form on the candidate page.") +
        switchRow("reminder", state.reminder, "Send a reminder if no receipt after 1 day", "A short note goes to the candidate the day after the onsite.") +
        switchRow("lateNotes", state.lateNotes, "Enable late notes", "A late note pings that day's interviewers by @mention in the thread.") +
        switchRow("gift", state.gift, "Enable thank-you gift", "Adds the gift sentence to the thank-you note.") +
        '<label>Gift provider</label>' + providerButtons() + '<p class="hint">Tremendous, PerfectGift.com and a Bath &amp; Body Works candle card are available.</p><label for="gift-amount">Gift amount</label><input id="gift-amount" inputmode="decimal" value="' + esc(state.giftAmount) + '"><p class="hint">The proposed amount is $25.</p><pre class="note" id="reminder-preview"></pre><pre class="note" id="live-preview"></pre></div>';
    }

    function queueBody() {
      const note = state.reimbursement
        ? ""
        : '<p>Parking reimbursement is off so new receipts would not arrive. The rows below are sample history.</p>';
      const cards = SUBMISSIONS.map((row, index) => {
        const label = row.status === "approved" ? "Approved" : row.status === "paid" ? "Paid" : "Pending";
        return '<div class="rowcard"><img class="thumb" alt="Receipt photo for ' + esc(row.name) + '" src="' + sampleReceiptSrc(row.amount) + '"><span><b>Amount</b>$' + esc(row.amount) + '</span><span><b>Method</b>' + esc(row.method) + '</span><span><b>Handle</b>' + esc(row.name) + ' · ' + esc(row.handle) + '</span><span><b>Status</b><span class="status ' + row.status + '">' + label + '</span></span><div class="row-actions"><button class="ghost tiny" type="button" data-approve="' + index + '"' + (row.status === "pending" ? "" : " disabled") + '>Approve</button><button class="ghost tiny" type="button" data-paid="' + index + '"' + (row.status === "approved" ? "" : " disabled") + '>Mark paid</button></div></div>';
      }).join("");
      return note + '<div class="rows">' + cards + '</div>';
    }

    function slackBody() {
      return '<div class="slack"><header>Thread · Nov 2 onsite<small>Pings ' + esc(SAMPLE.interviewers.join(" and ")) + '. Not a channel blast. Not posted.</small></header><article class="msg' + (state.lateNotes ? "" : " off") + '"><strong>Late note</strong><pre class="note" id="slack-late"></pre></article><article class="msg' + (state.reimbursement ? "" : " off") + '"><strong>Receipt uploaded</strong><pre class="note" id="slack-receipt"></pre></article></div>';
    }

    function welcome() {
      const items = [
        ["Parking receipts", "Candidates at a final interview in San Francisco have to save a parking receipt and email it by hand."],
        ["Running late", "When a candidate is running late they email in and no one knows unless someone keeps checking Gmail during a busy onsite day."],
        ["Losing touch", "Finalists who did not get the role can feel the same as people who were never considered. Strong candidates who chose another company drift away. A warm follow-up with a small gift is a signal that the door stays open."]
      ];
      const cards = items.map((item, index) => '<article class="problem"><strong><span class="num">' + (index + 1) + '</span>' + item[0] + '</strong><p>' + item[1] + '</p></article>').join("");
      return '<section data-step="welcome"><h1>A candidate-experience proposal</h1><div class="byline">' + arrow() + '<p class="name hand">by Val Whitten</p></div><div class="problems">' + cards + '</div><p>Part 1 is the page a candidate would use. Part 2 is what the Talent team would see behind it.</p><div class="row"><button class="cta big" type="button" id="start">Start the tour</button><button class="ghost" type="button" id="skip">Skip tour and explore freely</button></div></section>';
    }

    function transition() {
      return '<section data-step="transition"><h1>Now the same flow from the Talent team\'s side</h1><p class="lede">The switches, the receipt queue and the Slack posts are in this part. What you turn on is what the candidate page shows.</p></section>';
    }

    function closeScreen() {
      return '<section data-step="close"><h1>The proposal</h1><p>Here is what this page recommends.</p><div class="panel"><ul><li>The candidate enters their PayPal or Venmo handle on the form, so the team can pay right away.</li><li>The team can approve a receipt and mark it paid from the queue.</li><li>A reminder can go out if no receipt arrives the day after the onsite.</li><li>Late notes ping that day\'s interviewers in a thread.</li><li>Sam can send a thank-you note to a finalist\'s inbox.</li><li>Tremendous, PerfectGift.com and a Bath &amp; Body Works candle card are available for internal use.</li><li>The thank-you gift is $25.</li></ul></div><p>Nothing on this page is sent, paid or saved.</p><div class="row"><button class="cta big" type="button" id="explore">Look through it freely</button><button class="ghost" type="button" id="restart">Restart the tour</button></div></section>';
    }

    function stepBody(id) {
      if (id === "receipt") {
        return '<p class="for-team">The name and date are filled in from the onsite so the team does not match receipts to people.</p>' + candidateShell("Final interview in San Francisco", "The office is on the 7th floor at 85 2nd Street. Upload a photo of your parking receipt and tell us where to send the reimbursement.", receiptBody());
      }
      if (id === "late") {
        return '<p class="for-team">The candidate can say they are running late from this same page.</p>' + candidateShell("Running late", "Tell the team why and when you expect to arrive.", lateBody());
      }
      if (id === "compose") {
        return '<p class="for-team">Sam picks a finalist and sends a thank-you note. The next screen is that person\'s inbox.</p>' + teamShell("Send a thank-you note", "The note is filled in and you can edit it. Nothing leaves this page.", composeBody());
      }
      if (id === "inbox") {
        return '<p class="for-team">This is Jordan\'s inbox after Sam sends the note.</p>' + inboxBody();
      }
      if (id === "admin") {
        return '<p class="for-team">These are the switches the Talent team would use.</p>' + teamShell("Settings", "Turn a piece off to hide it on the candidate page. Both gift providers are available. The proposed gift amount is $25.", adminBody());
      }
      if (id === "queue") {
        return '<p class="for-team">Submitted receipts land here with the photo, the amount, the method, the handle and the status.</p>' + teamShell("Receipt submissions", "These three rows are synthetic samples.", queueBody());
      }
      if (id === "slack") {
        return '<p class="for-team">A late note pings that day\'s interviewers in a thread. A receipt notice sits with it.</p>' + teamShell("Slack", "This is a thread with the interviewers. Nothing here is posted.", slackBody());
      }
      return "";
    }

    function explore() {
      const blocks = [
        ["candidate", "receipt"],
        ["candidate", "late"],
        ["team", "admin"],
        ["team", "queue"],
        ["team", "slack"],
        ["team", "compose"],
        ["candidate", "inbox"]
      ].map(([side, id]) => '<section class="block" data-block="' + id + '"><p class="badge-inline ' + side + '">' + (side === "candidate" ? "CANDIDATE VIEW" : "INCIDENT.IO TEAM VIEW") + '</p>' + stepBody(id) + '</section>').join("");
      return '<section data-step="explore"><h1>Every part on one page</h1><p>Sample data is filled in. The switches change the candidate previews and the Slack messages.</p><p><button class="ghost" type="button" id="restart">Restart the tour</button></p></section>' + blocks;
    }

    function paintPreviews(root) {
      const late = root.querySelector("#late-preview");
      if (late) late.textContent = lateText();
      const live = root.querySelector("#live-preview");
      if (live) live.textContent = livePreviewText();
      const reminder = root.querySelector("#reminder-preview");
      if (reminder) reminder.textContent = reminderText();
      const slackLate = root.querySelector("#slack-late");
      if (slackLate) slackLate.textContent = slackLateText();
      const slackReceipt = root.querySelector("#slack-receipt");
      if (slackReceipt) slackReceipt.textContent = slackReceiptText();
      const note = root.querySelector("#note-text");
      if (note && document.activeElement !== note) note.value = state.noteOverride || thanksParagraphs().join("\n\n");
      const photo = root.querySelector("#receipt-photo");
      if (photo && !state.photoUrl) photo.src = sampleReceiptSrc(state.amount);
    }

    function paintAllPreviews() {
      paintPreviews(stage);
    }

    function bind(root) {
      const file = root.querySelector("#receipt-file");
      if (file) file.addEventListener("change", () => {
        const chosen = file.files && file.files[0];
        const slot = root.querySelector("#file-name");
        if (!chosen) {
          if (slot) slot.textContent = "A sample photo is already here. You can replace it. It stays in this browser.";
          return;
        }
        if (chosen.type.indexOf("image/") === 0) {
          if (state.photoUrl) URL.revokeObjectURL(state.photoUrl);
          state.photoUrl = URL.createObjectURL(chosen);
          const img = root.querySelector("#receipt-photo");
          if (img) img.src = state.photoUrl;
        }
        if (slot) slot.textContent = chosen.name + " stays in this browser.";
      });
      const amount = root.querySelector("#amount");
      if (amount) amount.addEventListener("input", () => { state.amount = amount.value; paintAllPreviews(); });
      const handleInput = root.querySelector("#handle");
      if (handleInput) handleInput.addEventListener("input", () => { state.handles[state.method] = handleInput.value; paintAllPreviews(); });
      const why = root.querySelector("#why");
      if (why) why.addEventListener("input", () => { state.why = why.value; paintAllPreviews(); });
      const giftAmount = root.querySelector("#gift-amount");
      if (giftAmount) giftAmount.addEventListener("input", () => { state.giftAmount = giftAmount.value; state.noteOverride = ""; paintAllPreviews(); });
      const note = root.querySelector("#note-text");
      if (note) note.addEventListener("input", () => { state.noteOverride = note.value; });
      root.querySelectorAll("[data-method]").forEach((button) => button.addEventListener("click", () => { state.method = button.getAttribute("data-method"); render(); }));
      root.querySelectorAll("[data-eta]").forEach((button) => button.addEventListener("click", () => { state.eta = Number(button.getAttribute("data-eta")); render(); }));
      root.querySelectorAll("[data-provider]").forEach((button) => button.addEventListener("click", () => { state.provider = button.getAttribute("data-provider"); state.noteOverride = ""; render(); }));
      root.querySelectorAll("[data-kind]").forEach((button) => button.addEventListener("click", () => {
        state.noteKind = button.getAttribute("data-kind");
        const people = peopleForKind();
        if (!people.some((person) => person.id === state.finalist)) state.finalist = people[0].id;
        state.noteOverride = "";
        render();
      }));
      root.querySelectorAll("[data-finalist]").forEach((button) => button.addEventListener("click", () => { state.finalist = button.getAttribute("data-finalist"); state.noteOverride = ""; render(); }));
      root.querySelectorAll("[data-toggle]").forEach((button) => button.addEventListener("click", () => {
        const key = button.getAttribute("data-toggle");
        state[key] = !state[key];
        if (key === "gift") state.noteOverride = "";
        render();
      }));
      root.querySelectorAll("[data-approve]").forEach((button) => button.addEventListener("click", () => {
        const row = SUBMISSIONS[Number(button.getAttribute("data-approve"))];
        if (row && row.status === "pending") { row.status = "approved"; render(); }
      }));
      root.querySelectorAll("[data-paid]").forEach((button) => button.addEventListener("click", () => {
        const row = SUBMISSIONS[Number(button.getAttribute("data-paid"))];
        if (row && row.status === "approved") { row.status = "paid"; render(); }
      }));
      const submit = root.querySelector("#submit-receipt");
      if (submit) submit.addEventListener("click", () => {
        state.submitted = true;
        const confirm = root.querySelector("#submit-note");
        if (confirm) confirm.hidden = false;
      });
      const send = root.querySelector("#send-thanks");
      if (send) send.addEventListener("click", () => {
        const field = root.querySelector("#note-text");
        state.sentNote = field ? field.value : thanksParagraphs().join("\n\n");
        state.sentSubject = subjectLine();
        state.sentTo = currentFinalist();
        state.thanksSent = true;
        state.mode = "tour";
        state.step = STEPS.findIndex((item) => item.id === "inbox");
        render();
      });
      const start = root.querySelector("#start");
      if (start) start.addEventListener("click", () => { state.mode = "tour"; state.step = 1; render(); });
      const skip = root.querySelector("#skip");
      if (skip) skip.addEventListener("click", () => { state.mode = "explore"; render(); });
      const exploreBtn = root.querySelector("#explore");
      if (exploreBtn) exploreBtn.addEventListener("click", () => { state.mode = "explore"; render(); });
      const restart = root.querySelector("#restart");
      if (restart) restart.addEventListener("click", () => { state.mode = "tour"; state.step = 0; render(); });
      paintAllPreviews();
    }

    function paintChrome() {
      const step = STEPS[state.step];
      const touring = state.mode === "tour";
      bar.hidden = !touring || step.id === "welcome";
      if (state.mode === "explore") {
        banner.hidden = true;
      } else if (step.side === "candidate") {
        banner.hidden = false;
        banner.className = "side-banner candidate";
        const extra = step.id === "inbox" ? "Their inbox" : "Part 1 · Candidate";
        banner.innerHTML = '<span class="badge">CANDIDATE VIEW</span><span>' + extra + '</span>';
      } else if (step.side === "team") {
        banner.hidden = false;
        banner.className = "side-banner team";
        banner.innerHTML = '<span class="badge">INCIDENT.IO TEAM VIEW</span><span>Part 2 · Team</span>';
      } else if (step.side === "switch") {
        banner.hidden = false;
        banner.className = "side-banner between";
        banner.innerHTML = '<span class="badge">BETWEEN PARTS</span><span>Part 1 Candidate to Part 2 Team</span>';
      } else {
        banner.hidden = true;
      }
      const part1Index = state.step <= 0 ? 0 : Math.min(2, state.step);
      const part2Index = state.step < 4 ? 0 : Math.min(4, state.step - 3);
      document.getElementById("fill1").style.width = (part1Index / 2 * 100) + "%";
      document.getElementById("fill2").style.width = (part2Index / 4 * 100) + "%";
      document.getElementById("part1").classList.toggle("is-current", touring && step.part === 1);
      document.getElementById("part1").classList.toggle("is-done", touring && state.step > 2);
      document.getElementById("part2").classList.toggle("is-current", touring && step.part === 2);
      document.getElementById("part2").classList.toggle("is-done", touring && state.step > 7);
      let label = "";
      if (step.part === 1) label = "Part 1 · Candidate · Step " + state.step + " of 2";
      else if (step.part === 2) label = "Part 2 · Team · Step " + (state.step - 3) + " of 4";
      else if (step.id === "transition") label = "Between Part 1 Candidate and Part 2 Team";
      else if (step.id === "inbox") label = "Candidate inbox";
      else if (step.id === "close") label = "Part 1 Candidate and Part 2 Team";
      document.getElementById("stepnum").textContent = label;
      document.getElementById("back").disabled = state.step === 0;
      const next = document.getElementById("next");
      next.disabled = state.step === STEPS.length - 1;
      next.textContent = state.step === STEPS.length - 1 ? "Done" : "Next";
    }

    function render() {
      const changed = painted.mode !== state.mode || painted.step !== state.step;
      const y = window.scrollY;
      if (state.mode === "explore") stage.innerHTML = explore();
      else if (STEPS[state.step].id === "welcome") stage.innerHTML = welcome();
      else if (STEPS[state.step].id === "transition") stage.innerHTML = transition();
      else if (STEPS[state.step].id === "close") stage.innerHTML = closeScreen();
      else stage.innerHTML = '<section data-step="' + STEPS[state.step].id + '">' + stepBody(STEPS[state.step].id) + '</section>';
      bind(stage);
      paintChrome();
      if (changed) window.scrollTo(0, 0);
      else window.scrollTo(0, y);
      painted = { mode: state.mode, step: state.step };
    }

    document.getElementById("back").addEventListener("click", () => {
      if (state.mode !== "tour") return;
      state.step = Math.max(0, state.step - 1);
      render();
    });
    document.getElementById("next").addEventListener("click", () => {
      if (state.mode !== "tour") return;
      if (state.step < STEPS.length - 1) {
        state.step += 1;
        render();
      }
    });
    document.getElementById("skip-bar").addEventListener("click", () => {
      state.mode = "explore";
      render();
    });

    render();
  </script>
</body>
</html>
